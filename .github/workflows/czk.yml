on: push

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: pwd
            - run: npm install
            - run: npm run docs:build
            - uses: actions/upload-pages-artifact@v3
              with:
                path: docs/.vitepress/dist     
                
    job2:
        needs: job1
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/deploy-pages@v4
           
            
